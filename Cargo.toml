[workspace]
members = [
    "crates/sigil-types",
    "crates/sigil-crypto",
    "crates/sigil-vault",
    "crates/sigil-ipc",
    "crates/sigil-ipc-server",
    "crates/sigil-client",
    "crates/sigil-dbus-secrets",
    "crates/sigil",
    "crates/sigil-prompter",
    "crates/sigil-pam",
]
resolver = "2"

[workspace.package]
version = "1.3.11"
license = "MIT"
authors = ["Sigil Project"]
edition = "2021"

[workspace.dependencies]
tokio = { version = "1.43", features = ["full"] }
zbus = "5.4"
oo7 = "0.6"
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
chacha20poly1305 = "0.10"
argon2 = "0.5"
zeroize = { version = "1.8", features = ["derive"] }
thiserror = "2.0"
directories = "6.0"
rand = { version = "0.8", features = ["getrandom"] }
aes = "0.8"
cbc = "0.1"
sha2 = "0.10"
hkdf = "0.12"
hmac = "0.12"
num-bigint = { version = "0.4", features = ["rand"] }
num-traits = "0.2"
iris = { git = "https://github.com/ming2k/optics", tag = "v0.0.66" }
lens = { git = "https://github.com/ming2k/optics", tag = "v0.0.66" }
lens-sys = { git = "https://github.com/ming2k/optics", tag = "v0.0.66" }
flux = { git = "https://github.com/ming2k/optics", tag = "v0.0.66" }
flux-sys = { git = "https://github.com/ming2k/optics", tag = "v0.0.66" }
libc = "0.2"
clap = { version = "4.5", features = ["derive", "env"] }

[profile.dev.package.argon2]
opt-level = 3

[profile.test.package.argon2]
opt-level = 3
