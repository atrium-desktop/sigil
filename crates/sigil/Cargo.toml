[package]
name = "sigil"
version.workspace = true
edition = "2021"
authors = ["Sigil Project"]
description = "Desktop session credential infrastructure daemon"
license.workspace = true

[dependencies]
sigil-types = { path = "../sigil-types" }
sigil-crypto = { path = "../sigil-crypto" }
sigil-vault = { path = "../sigil-vault" }
sigil-ipc = { path = "../sigil-ipc" }
sigil-ipc-server = { path = "../sigil-ipc-server" }
sigil-dbus-secrets = { path = "../sigil-dbus-secrets" }
sigil-client = { path = "../sigil-client", features = ["async", "sync"] }
tokio = { workspace = true }
zbus = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
directories = { workspace = true }
zeroize = { workspace = true }
thiserror = { workspace = true }
libc = { workspace = true }
futures-util = { workspace = true }
clap = { workspace = true }
