[package]
name = "sigil-client"
version = "0.1.1"
edition = "2021"
authors = ["Sigil Project"]
description = "Async client library for sigil native IPC"
license.workspace = true

[dependencies]
sigil-ipc = { path = "../sigil-ipc" }
tokio = { workspace = true, features = ["net", "io-util", "sync", "time"] }
thiserror = { workspace = true }
zeroize = { workspace = true, features = ["derive"] }
tracing = { workspace = true }

[dev-dependencies]
sigil-core = { path = "../sigil-core" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
zbus = { workspace = true }
libc = { workspace = true }
