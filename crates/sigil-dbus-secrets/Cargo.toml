[package]
name = "sigil-dbus-secrets"
version.workspace = true
edition = "2021"
authors = ["Sigil Project"]
description = "Secret Service D-Bus frontend protocol adapter for sigil"
license.workspace = true

[dependencies]
sigil-types = { path = "../sigil-types" }
sigil-vault = { path = "../sigil-vault" }
zbus = { workspace = true }
tokio = { workspace = true, features = ["sync", "time"] }
serde = { workspace = true, features = ["derive"] }
zeroize = { workspace = true, features = ["derive"] }
tracing = { workspace = true }
rand = { workspace = true }
thiserror = { workspace = true }
aes = { workspace = true }
cbc = { workspace = true }
hkdf = { workspace = true }
sha2 = { workspace = true }
num-bigint = { workspace = true }
num-traits = { workspace = true }

[dev-dependencies]
futures-util = { workspace = true }
