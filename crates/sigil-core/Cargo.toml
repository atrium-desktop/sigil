[package]
name = "sigil-core"
version = "0.1.1"
edition = "2021"
authors = ["Sigil Project"]
description = "Core cryptographic engine, envelope multi-slot vault store, and lifecycle service for sigil"
license.workspace = true

[dependencies]
sigil-ipc = { path = "../sigil-ipc" }
chacha20poly1305 = { workspace = true }
argon2 = { workspace = true }
aes = { workspace = true }
cbc = { workspace = true }
hkdf = { workspace = true }
sha2 = { workspace = true }
zeroize = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["sync", "time", "net", "io-util", "rt"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tracing = { workspace = true }
rand = { workspace = true }
num-bigint = { workspace = true }
num-traits = { workspace = true }
thiserror = { workspace = true }
libc = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
