[package]
name = "sigil-client"
version.workspace = true
edition = "2021"
authors = ["Sigil Project"]
description = "Client library for sigil native IPC (sync and async)"
license.workspace = true

[features]
default = ["async"]
async = ["dep:tokio", "sigil-ipc/async"]
sync = ["sigil-ipc/sync"]

[dependencies]
sigil-types = { path = "../sigil-types" }
sigil-ipc = { path = "../sigil-ipc", default-features = false }
tokio = { workspace = true, features = ["net", "io-util", "sync", "time"], optional = true }
thiserror = { workspace = true }
zeroize = { workspace = true, features = ["derive"] }
tracing = { workspace = true }

[dev-dependencies]
sigil-crypto = { path = "../sigil-crypto" }
sigil-vault = { path = "../sigil-vault" }
sigil-ipc-server = { path = "../sigil-ipc-server" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
zbus = { workspace = true }
libc = { workspace = true }
