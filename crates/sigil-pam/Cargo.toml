[package]
name = "sigil-pam"
version.workspace = true
edition = "2021"
license.workspace = true

[lib]
crate-type = ["cdylib"]
name = "pam_sigil"

[dependencies]
pamsm = { version = "0.4.3", features = ["libpam"] }
libc = "0.2"
sigil-types = { path = "../sigil-types" }
sigil-ipc = { path = "../sigil-ipc", default-features = false, features = ["sync"] }
zeroize = { workspace = true, features = ["derive"] }
