[package]
name = "sigil-pam"
version = "1.3.9"
edition = "2021"
license.workspace = true

[lib]
crate-type = ["cdylib"]
name = "pam_sigil"

[dependencies]
pamsm = { version = "0.4.3", features = ["libpam"] }
libc = "0.2"
sigil-ipc = { path = "../sigil-ipc" }
zeroize = { workspace = true, features = ["derive"] }
